name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

      - name: Publicar o exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish src/ThermoBook -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=$version -o publish

      - name: Gerar o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION installer\ThermoBook.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Criar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' "installer\Output\ThermoBook-Setup-$env:VERSION.exe" --title "ThermoBook $env:VERSION" --generate-notes
